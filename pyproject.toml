[project]
name = "grid-ops-env"
version = "0.1.0"
description = "Power Grid Emergency Operations Environment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.1",
    "openai>=1.30.1",
    "python-dotenv>=1.0.1",
    "openenv-core>=0.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0"
]

[project.scripts]
server = "server.app:start_server"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
